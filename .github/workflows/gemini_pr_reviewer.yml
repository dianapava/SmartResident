name: Gemini Senior Developer PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Permiso obligatorio para que el bot pueda comentar en tu PR
    
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      
      - name: Revisión con IA (Gemini CLI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 1. Sacamos los cambios del Pull Request usando la herramienta oficial de GitHub
          DIFF=$(gh pr diff $PR_NUMBER)
          
          # 2. Armamos el mensaje para Gemini (nuestro prompt VIPER Paisa)
          JSON_PAYLOAD=$(jq -n --arg diff "$DIFF" '{
            contents: [{
              parts: [{
                text: ("Eres un Senior iOS Developer paisa (de Colombia). Revisa el código de este Pull Request de tu amiga Ale. Sé amable, claro y fomenta buenas prácticas de VIPER y Clean Architecture. Tu respuesta debe ir directo al grano y en español paisa.\n\nAquí están los cambios:\n" + $diff)
              }]
            }]
          }')
          
          # 3. Le pegamos directamente a la API de Google Gemini (modelo 1.5 flash)
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")
            
          COMMENT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text')
          
          # 4. Publicamos la respuesta de la IA como un comentario en tu Pull Request
          gh pr comment $PR_NUMBER --body "$COMMENT"
